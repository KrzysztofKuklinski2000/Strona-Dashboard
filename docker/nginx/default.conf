server {
  listen 80;
  server_name localhost;
  root /app/public;
  index index.php;
  autoindex off;

  client_max_body_size 10M;
  add_header X-Content-Type-Options nosniff always;

  # Stare adresy zapisane w bazie i zakładkach nadal działają.
  rewrite ^/public/(.*)$ /$1;
  rewrite ^/images/(logo\.png|logo\.gif|logo1\.png)$ /images/branding/$1 last;
  rewrite ^/images/(decor-bamboo\.png)$ /images/decorations/$1 last;
  rewrite ^/images/(family-training\.png|oyama\.jpg)$ /images/pages/$1 last;
  rewrite ^/images/hero-cinematic/tiles/(.*)$ /images/hero/$1 last;

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  # Uploady są plikami statycznymi z zamkniętej listy formatów, nigdy skryptami.
  location ~* ^/uploads/(?:(?:gallery|news|homepage)/)?[a-z0-9][a-z0-9._-]*\.(?:jpe?g|png|gif|webp)$ {
    try_files $uri =404;
  }

  location ~* ^/uploads(?:/|$) {
    return 404;
  }

  location = /index.php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
  }

  # Stare adresy trafiają wyłącznie do front controllera obsługującego przekierowania.
  location ~ ^/index\.php/ {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
  }

  location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) {
    return 404;
  }

  location ~* \.(?:css|js|jpe?g|png|gif|webp|svg|ico|woff2?|ttf|map)$ {
    try_files $uri =404;
  }

  # /dashboard jest trasą aplikacji mimo katalogu zasobów o tej samej nazwie.
  location / {
    rewrite ^ /index.php last;
  }
}
