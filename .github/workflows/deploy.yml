name: Deploy to MyDevil


on:
  push:
    branches:
      - master

permissions: {
  contents: read
}


concurrency:
  group: mydevil-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.2'
          tools: composer:2
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Check PHP syntax
        shell: bash
        run:  |
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

      - name: Prepare SSH files
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"


          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/deploy_known_hosts"

      - name: Deploy to MyDevil
        shell: bash
        run: |
          ssh -T \
          -i "$RUNNER_TEMP/deploy_key" \
          -o IdentitiesOnly=yes \
          -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts" \
          -o ConnectTimeout=15 \
          Musashi14@s92.mydevil.net "$GITHUB_SHA"

      - name: Check website
        shell: bash
        run: |
          status=$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            https://kyokushin-wejherowo.com.pl/)

          printf 'Website HTTP status: %s\n' "$status"
          test "$status" = "200"